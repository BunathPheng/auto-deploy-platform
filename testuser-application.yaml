apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testuser
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BunathPheng/auto-deploy-platform.git
    targetRevision: HEAD
    path: platform-shared/helm/app-chart
    helm:
      valueFiles:
      - users/testuser/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: testuser
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
