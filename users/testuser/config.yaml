# User Template Configuration
# This file serves as a template for user-specific configurations
# Copy this file to users/{username}/config.yaml and customize as needed

# Application Configuration
app:
  name: "my-app"
  version: "1.0.0"
  environment: "development"
  
# Container Configuration
container:
  image:
    repository: "docker.io/phengbunath/my-app"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  
# Resource Configuration
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Service Configuration
service:
  type: "ClusterIP"
  port: 80
  targetPort: 8080

# Ingress Configuration
ingress:
  enabled: false
  host: "my-app.example.com"
  tls:
    enabled: false
    secretName: "my-app-tls"

# Environment Variables
env:
  - name: "NODE_ENV"
    value: "production"
  - name: "LOG_LEVEL"
    value: "info"
  - name: "DATABASE_URL"
    valueFrom:
      secretKeyRef:
        name: "my-app-secrets"
        key: "database-url"

# Health Checks
healthCheck:
  livenessProbe:
    httpGet:
      path: "/health"
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: "/ready"
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

# Scaling Configuration
scaling:
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Deployment Strategy
deployment:
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

# Monitoring and Logging
monitoring:
  enabled: true
  prometheus:
    enabled: true
    path: "/metrics"
  grafana:
    enabled: false

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
