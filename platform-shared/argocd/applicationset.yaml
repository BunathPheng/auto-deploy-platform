apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: auto-deploy-applications
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/acme/auto-deploy-platform.git
      revision: HEAD
      files:
      - path: "users/*/config.yaml"
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/acme/auto-deploy-platform.git
        targetRevision: HEAD
        path: platform-shared/helm/app-chart
        helm:
          valueFiles:
          - "users/{{path.basename}}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  goTemplate: true
